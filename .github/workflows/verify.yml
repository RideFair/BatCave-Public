name: Verify source
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check source privacy
        run: python Scripts/check_public_source.py
      - name: Scan history for secrets
        shell: pwsh
        run: |
          $url = 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Scanner checksum mismatch' }
          $scannerDirectory = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive $archive -DestinationPath $scannerDirectory
          & (Join-Path $scannerDirectory 'gitleaks.exe') git . --log-opts=--all --redact=100 --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'History secret scan failed' }
      - name: Build desktop app
        run: dotnet build Operating_System_Specific/Windows/BatCaveWindowsAgent -c Release
      - name: Bridge regressions
        run: dotnet run --project Operating_System_Specific/Windows/BridgeRegressionTests -c Release
      - name: Authentication and framing checks
        run: dotnet run --project Operating_System_Specific/Windows/SecureTransportTests -c Release
      - name: Modifier regressions
        run: dotnet run --project Operating_System_Specific/Windows/ModifierRegressionTests -c Release
      - name: Monitor routing and persistence
        run: dotnet run --project Operating_System_Specific/Windows/TopologyRegressionTests -c Release
      - name: Dependency advisory check
        shell: pwsh
        run: |
          $json = dotnet package list --project Operating_System_Specific/Windows/BatCaveWindowsAgent --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency advisory lookup failed' }
          $report = $json | ConvertFrom-Json
          $packages = $report.projects | ForEach-Object { $_.frameworks } | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) }
          if (@($packages | Where-Object { $_.vulnerabilities }).Count -gt 0) { throw 'Vulnerable dependency reported' }
      - name: Build and check Windows installer on disposable runner
        shell: pwsh
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Compiler checksum mismatch' }
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'inno6'
          $install = Start-Process $compilerSetup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $compilerDirectory + '"') -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Compiler setup failed' }
          $packages = Join-Path $env:RUNNER_TEMP 'BatCave-Windows-packages'
          & Operating_System_Specific/Windows/Packaging/Build-Installer.ps1 -InnoCompiler (Join-Path $compilerDirectory 'ISCC.exe') -OutputDirectory $packages
          $publish = Get-ChildItem .build/installer -Directory -Filter 'win-x64-*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          python Scripts/check_package_privacy.py $publish.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Package privacy check failed' }
          & Operating_System_Specific/Windows/Packaging/Test-InstallerOnRunner.ps1 -Installer (Join-Path $packages 'BatCave-0.3.0-Windows-x64-Setup.exe')
      - name: Upload Windows installer and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatCave-Windows-x64
          path: ${{ runner.temp }}/BatCave-Windows-packages/*
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Mac backend
        run: swift build --package-path Operating_System_Specific/MacOS -c release
      - name: Mac input, identity, TLS and file regressions
        env:
          BATCAVE_RENDER_OUTPUT: ${{ runner.temp }}/batcave-macos-screenshots
        run: swift test --package-path Operating_System_Specific/MacOS
      - name: Upload synthetic Mac screenshots for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatCave-macOS-Setup-Screenshots
          path: ${{ runner.temp }}/batcave-macos-screenshots/*.png
          if-no-files-found: error
      - name: Check bundle script syntax
        run: |
          for script in Operating_System_Specific/MacOS/Scripts/*.sh; do
            bash -n "$script"
          done
      - name: Verify bundle destination guards
        run: python3 Scripts/test_bundle_paths.py
      - name: Build isolated Mac setup installer
        run: bash Operating_System_Specific/MacOS/Scripts/build_setup_preview.sh
      - name: Inspect Mac package contents for private artifacts
        run: python3 Scripts/check_package_privacy.py Operating_System_Specific/MacOS/Build/SetupPreview/BatCave.app
      - name: Verify versioned installation and desktop alias preservation
        run: python3 Operating_System_Specific/MacOS/Scripts/test_setup_preview_install.py
      - name: Upload Mac installer and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatCave-macOS-${{ runner.arch }}
          path: Operating_System_Specific/MacOS/Build/SetupPreview/Packages/*
          if-no-files-found: error
          retention-days: 14
