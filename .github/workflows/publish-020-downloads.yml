name: Verify and publish frozen 0.2.0 downloads

on:
  push:
    branches: [codex/fix-020-downloads]
    paths:
      - .github/workflows/publish-020-downloads.yml
      - Scripts/publish_020_downloads.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batcave-020-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed assets without changing the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/publish_020_downloads.py
