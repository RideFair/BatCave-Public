name: Verify Linux
on:
  push:
    paths:
      - 'Operating_System_Specific/Linux/**'
      - '.github/workflows/linux-preview.yml'
  pull_request:
    paths:
      - 'Operating_System_Specific/Linux/**'
      - '.github/workflows/linux-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interop-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Compile the optional Windows transport fixture
        run: dotnet build Operating_System_Specific/Linux/tests/windows_interop/WindowsInterop.csproj -c Release
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distro-maintained Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libei-dev libeis-dev \
            python3-gi python3-cryptography gir1.2-gtk-4.0 gir1.2-secret-1 xvfb dbus-x11
      - name: Native EIS, TLS, lifecycle state and filesystem checks
        run: sh Operating_System_Specific/Linux/scripts/test.sh
      - name: Source privacy gate
        run: python3 Scripts/check_public_source.py
      - name: Check GTK approval gates and render setup at both sizes
        env:
          GSK_RENDERER: cairo
          PYTHONPATH: Operating_System_Specific/Linux:Operating_System_Specific/Linux/tests
        run: |
          mkdir -p /tmp/batcave-linux-screenshots
          for view in permissions pair pair-receive pair-approved layout link files details details-approved; do
            for size in default small; do
              args=()
              if [ "$size" = small ]; then args=(small); fi
              dbus-run-session -- xvfb-run -a python3 Operating_System_Specific/Linux/tests/render_desktop.py \
                "/tmp/batcave-linux-screenshots/$view-$size.png" "$view" "${args[@]}"
            done
          done
      - name: Upload synthetic GTK screenshots for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatCave-Linux-Setup-Screenshots
          path: /tmp/batcave-linux-screenshots/*.png
          if-no-files-found: error
      - name: Build Debian package
        run: sh Operating_System_Specific/Linux/scripts/package.sh
      - name: Install and remove on the disposable runner
        run: |
          profile=$(mktemp -d /tmp/batcave-package-check.XXXXXXXX)
          export XDG_DATA_HOME="$profile"
          sudo apt-get install -y ./Operating_System_Specific/Linux/.build/BatCave-Linux-0.2.0-amd64.deb
          test "$(batcave-linux-preview --version)" = '0.2.0'
          batcave-linux-preview --diagnose > /tmp/batcave-diagnose.json || test "$?" = 2
          test ! -e "$profile/batcave/secure-preview/identity.json"
          mkdir -p "$profile/batcave/secure-preview"
          printf 'retain existing user state\n' > "$profile/batcave/secure-preview/marker"
          sudo apt-get remove -y batcave-linux-preview
          test ! -e /usr/bin/batcave-linux-preview
          test "$(cat "$profile/batcave/secure-preview/marker")" = 'retain existing user state'
